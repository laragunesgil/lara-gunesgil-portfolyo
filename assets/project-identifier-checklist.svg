<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Tanımlayıcı bilgi kontrolü</title>
  <desc id="desc">Ad, telefon ve adres için evet veya hayır yanıtlarını arşiv kararıyla eşleyen temsili bir kontrol listesi.</desc>
  <rect width="800" height="480" rx="28" fill="#e4ede4"/>
  <rect x="110" y="60" width="580" height="360" rx="22" fill="#fffdf7" stroke="#c8d0c8" stroke-width="4"/>
  <text x="155" y="116" fill="#17372f" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Tanımlayıcı kontrolü</text>
  <g font-family="system-ui, sans-serif" font-size="23" fill="#17372f">
    <text x="160" y="182">Ad bilgisi</text><text x="160" y="244">Telefon</text><text x="160" y="306">Adres</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="440" y="150" width="82" height="42" rx="12" fill="#f7e1d2"/><text x="481" y="178" fill="#713517">EVET</text>
    <rect x="535" y="150" width="82" height="42" rx="12" fill="#e4ede4"/><text x="576" y="178" fill="#174535">HAYIR</text>
    <rect x="440" y="212" width="82" height="42" rx="12" fill="#f7e1d2"/><text x="481" y="240" fill="#713517">EVET</text>
    <rect x="535" y="212" width="82" height="42" rx="12" fill="#e4ede4"/><text x="576" y="240" fill="#174535">HAYIR</text>
    <rect x="440" y="274" width="82" height="42" rx="12" fill="#f7e1d2"/><text x="481" y="302" fill="#713517">EVET</text>
    <rect x="535" y="274" width="82" height="42" rx="12" fill="#e4ede4"/><text x="576" y="302" fill="#174535">HAYIR</text>
  </g>
  <path d="M400 335v22" fill="none" stroke="#1f5b49" stroke-width="5" stroke-linecap="round"/>
  <path d="m390 349 10 10 10-10" fill="none" stroke="#1f5b49" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="202" y="366" width="396" height="36" rx="12" fill="#223a2e"/>
  <text x="400" y="391" fill="#f2f4ec" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Temizleme veya arşiv kararı</text>
</svg>
